<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socratic Mastery Audio</title>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #242424;
  --border: #333;
  --text: #e8e8e8;
  --text-dim: #888;
  --accent: #4a9eff;
  --accent-hover: #6db3ff;
  --green: #4caf50;
  --orange: #ff9800;
  --red: #f44336;
  --purple: #9c27b0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }

/* Header */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.header h1 {
  font-size: 1.25rem;
  font-weight: 600;
  white-space: nowrap;
}
.header .stats {
  font-size: 0.85rem;
  color: var(--text-dim);
  white-space: nowrap;
}

/* Module tabs */
.tabs {
  display: flex;
  gap: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.tab {
  padding: 0.75rem 1.25rem;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  font-size: 0.9rem;
  color: var(--text-dim);
  transition: all 0.2s;
  user-select: none;
}
.tab:hover { color: var(--text); background: var(--surface2); }
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tab .count {
  display: inline-block;
  background: var(--surface2);
  border-radius: 10px;
  padding: 0 6px;
  font-size: 0.75rem;
  margin-left: 6px;
}
.tab.active .count { background: rgba(74, 158, 255, 0.2); }

/* Content area */
.content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 1.5rem;
}

/* Search */
.search-bar {
  margin-bottom: 1.5rem;
}
.search-bar input {
  width: 100%;
  padding: 0.7rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.95rem;
  outline: none;
}
.search-bar input:focus { border-color: var(--accent); }
.search-bar input::placeholder { color: var(--text-dim); }

/* Category groups */
.category {
  margin-bottom: 2rem;
}
.category-header {
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  margin-bottom: 0.75rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}

/* Concept cards */
.concept-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.concept-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.25rem;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.concept-card:hover {
  border-color: var(--accent);
  background: var(--surface2);
}
.concept-card.active {
  border-color: var(--accent);
  background: rgba(74, 158, 255, 0.08);
}
.concept-card .info {
  flex: 1;
  min-width: 0;
}
.concept-card .title {
  font-weight: 500;
  font-size: 0.95rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.concept-card .meta {
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-top: 2px;
}
.concept-card .difficulty {
  display: flex;
  gap: 2px;
}
.concept-card .difficulty .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--border);
}
.concept-card .difficulty .dot.filled { background: var(--accent); }
.concept-card .duration {
  font-size: 0.8rem;
  color: var(--text-dim);
  white-space: nowrap;
}
.concept-card .play-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.1s;
}
.concept-card .play-btn:hover { transform: scale(1.1); }
.concept-card .play-btn svg {
  width: 16px;
  height: 16px;
  fill: white;
}

/* Player */
.player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 0.75rem 1.5rem;
  display: none;
  z-index: 100;
}
.player.visible { display: block; }
.player-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.player .now-playing {
  flex: 0 0 auto;
  max-width: 250px;
  overflow: hidden;
}
.player .now-playing .title {
  font-size: 0.85rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.player .now-playing .module {
  font-size: 0.75rem;
  color: var(--text-dim);
}
.player .controls {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.player .controls button {
  background: none;
  border: none;
  color: var(--text);
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
}
.player .controls button:hover { color: var(--accent); }
.player .controls button svg { width: 20px; height: 20px; fill: currentColor; }
.player .controls .play-pause svg { width: 28px; height: 28px; }
.player .progress-area {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.player .progress-bar {
  flex: 1;
  height: 4px;
  background: var(--surface2);
  border-radius: 2px;
  cursor: pointer;
  position: relative;
}
.player .progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  width: 0%;
  transition: width 0.1s linear;
}
.player .time {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.player .speed-btn {
  font-size: 0.75rem;
  background: var(--surface2) !important;
  border-radius: 4px !important;
  padding: 2px 6px !important;
  color: var(--text-dim) !important;
  min-width: 40px;
  text-align: center;
}
.player .speed-btn:hover { color: var(--accent) !important; }

/* Reader view */
.reader {
  display: none;
  margin-bottom: 6rem;
}
.reader.visible { display: block; }
.reader-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.reader-header .back {
  cursor: pointer;
  color: var(--text-dim);
  font-size: 0.9rem;
}
.reader-header .back:hover { color: var(--accent); }
.reader-header h2 { font-size: 1.3rem; font-weight: 600; }
.reader-body {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2rem;
  line-height: 1.8;
  font-size: 1rem;
  max-width: 800px;
  white-space: pre-wrap;
}

/* Responsive */
@media (max-width: 640px) {
  .header-inner { flex-direction: column; align-items: flex-start; gap: 0.25rem; }
  .tab { padding: 0.6rem 1rem; font-size: 0.8rem; }
  .concept-card { flex-wrap: wrap; }
  .player-inner { flex-wrap: wrap; gap: 0.5rem; }
  .player .now-playing { max-width: 100%; flex: 1 1 100%; }
  .player .progress-area { flex: 1 1 100%; order: 10; }
  .reader-body { padding: 1rem; font-size: 0.9rem; }
}

/* No audio fallback */
.no-audio-msg {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  font-size: 0.85rem;
  color: var(--text-dim);
  text-align: center;
  margin-top: 0.5rem;
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #555; }

.module-list-view { margin-bottom: 5rem; }

.concept-figure {
  display: block;
  white-space: normal;
  margin: 1.5rem 0;
  padding: 0.75rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.concept-figure img {
  display: block;
  width: 100%;
  height: auto;
  /* Tall sagittal spine images otherwise eat a whole screen each and break up
     the prose; bound them while keeping the full image visible. */
  max-height: 70vh;
  object-fit: contain;
  border-radius: 4px;
  background: #000;
}
.concept-figure figcaption {
  margin-top: 0.6rem;
  font-size: 0.85rem;
  line-height: 1.5;
  color: var(--text-dim);
}
.concept-figure .fig-label { color: var(--text); font-weight: 600; }
.concept-figure .fig-credit { display: block; margin-top: 0.35rem; font-size: 0.78rem; color: var(--text-dim); }
a.fig-credit { color: var(--accent); text-decoration: none; }
a.fig-credit:hover { color: var(--accent-hover); text-decoration: underline; }
.figure-gallery { white-space: normal; margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem; }
.figure-gallery h3 { font-size: 0.95rem; color: var(--text-dim); margin: 0 0 0.5rem; font-weight: 600; }

.selftest {
  white-space: normal;
  margin-top: 2.5rem;
  padding-top: 1.25rem;
  border-top: 2px solid var(--accent);
}
.selftest-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.selftest-head h3 { margin: 0; font-size: 1.05rem; color: var(--text); }
.q-count {
  display: inline-block; margin-left: 0.4rem; padding: 0.1rem 0.5rem;
  font-size: 0.75rem; border-radius: 10px; background: var(--surface2); color: var(--text-dim);
}
.selftest-hint { margin: 0.4rem 0 1rem; font-size: 0.85rem; color: var(--text-dim); }
.q-all {
  background: none; border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 6px; padding: 0.3rem 0.7rem; font-size: 0.78rem; cursor: pointer; white-space: nowrap;
}
.q-all:hover { color: var(--text); border-color: var(--accent); }
.q-card {
  display: flex; gap: 0.75rem; margin-bottom: 0.75rem; padding: 0.85rem;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
}
.q-num {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--surface);
  color: var(--text-dim); font-size: 0.78rem; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.q-body { flex: 1; min-width: 0; }
.q-text { font-size: 0.95rem; line-height: 1.5; color: var(--text); }
.q-btn {
  margin-top: 0.6rem; background: none; border: 1px solid var(--border); color: var(--accent);
  border-radius: 6px; padding: 0.28rem 0.7rem; font-size: 0.78rem; cursor: pointer;
}
.q-btn:hover { border-color: var(--accent); color: var(--accent-hover); }
.q-ans {
  margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px dashed var(--border);
  font-size: 0.9rem; line-height: 1.6; color: var(--text-dim);
}
.q-probe { margin-top: 0.55rem; font-size: 0.85rem; color: var(--text-dim); }
.q-probe span { color: var(--yellow, var(--orange)); font-weight: 600; }

.cases { white-space: normal; margin-top: 2.5rem; padding-top: 1.25rem; border-top: 2px solid var(--orange, var(--accent)); }
.cases-head h3 { margin: 0; font-size: 1.05rem; color: var(--text); }
.case-card {
  margin-bottom: 1.1rem; padding: 1rem;
  background: var(--surface2); border: 1px solid var(--border);
  border-left: 3px solid var(--orange, var(--accent)); border-radius: 8px;
}
.case-head { font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--orange, var(--accent)); font-weight: 700; margin-bottom: 0.5rem; }
.case-stem { font-size: 0.95rem; line-height: 1.6; color: var(--text); margin-bottom: 0.9rem; }
.case-stage { padding-top: 0.75rem; margin-top: 0.75rem; border-top: 1px dashed var(--border); }
.case-q { font-size: 0.92rem; line-height: 1.55; color: var(--text); }
.case-step {
  display: inline-block; margin-right: 0.45rem; padding: 0.08rem 0.45rem;
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
  border-radius: 4px; background: var(--surface); color: var(--text-dim);
}
.case-btn {
  margin-top: 0.55rem; background: none; border: 1px solid var(--border);
  color: var(--orange, var(--accent)); border-radius: 6px; padding: 0.28rem 0.7rem;
  font-size: 0.78rem; cursor: pointer;
}
.case-btn:hover { border-color: var(--orange, var(--accent)); }
.case-a { margin-top: 0.6rem; font-size: 0.89rem; line-height: 1.6; color: var(--text-dim); }
.case-done { margin-top: 0.8rem; font-size: 0.78rem; color: var(--text-dim); font-style: italic; }


.ma-due-pill { background: var(--orange, var(--accent)); color: #000; padding: 0.05rem 0.45rem; border-radius: 10px; font-weight: 700; font-size: 0.78rem; }
.ma-filter { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.ma-chip { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); border-radius: 14px; padding: 0.3rem 0.85rem; font-size: 0.8rem; cursor: pointer; }
.ma-chip.on { color: #000; background: var(--accent); border-color: var(--accent); font-weight: 600; }
.ma-pip { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.6rem; background: var(--border); }
.ma-pip.ma-learning { background: var(--orange, #ff9800); }
.ma-pip.ma-review   { background: var(--accent); }
.ma-pip.ma-mastered { background: var(--green, #4caf50); }
.ma-duetag { color: var(--orange, #ff9800); font-weight: 600; }
.ma-review { white-space: normal; margin-top: 2.5rem; padding-top: 1.25rem; border-top: 2px solid var(--border); }
.ma-review-head { display: flex; align-items: center; gap: 0.6rem; }
.ma-state { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; padding: 0.12rem 0.5rem; border-radius: 4px; background: var(--surface2); color: var(--text-dim); }
.ma-state.ma-learning { color: var(--orange, #ff9800); }
.ma-state.ma-review   { color: var(--accent); }
.ma-state.ma-mastered { color: var(--green, #4caf50); }
.ma-due { font-size: 0.82rem; color: var(--text-dim); }
.ma-review-hint { margin: 0.45rem 0 0.8rem; font-size: 0.85rem; color: var(--text-dim); }
.ma-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.ma-btn { border: 1px solid var(--border); background: var(--surface2); color: var(--text); border-radius: 6px; padding: 0.45rem 0.9rem; font-size: 0.85rem; cursor: pointer; }
.ma-btn.ma-missed:hover { border-color: var(--red, #f44336); color: var(--red, #f44336); }
.ma-btn.ma-shaky:hover  { border-color: var(--orange, #ff9800); color: var(--orange, #ff9800); }
.ma-btn.ma-got:hover    { border-color: var(--green, #4caf50); color: var(--green, #4caf50); }
.ma-drill { white-space: normal; margin-top: 1.5rem; padding: 1rem; background: var(--surface2); border: 1px solid var(--accent); border-radius: 8px; }
.ma-drill-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
.ma-drill-body { font-size: 0.9rem; line-height: 1.6; color: var(--text-dim); white-space: pre-wrap; }
.ma-drill-btn { margin-top: 1rem; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; padding: 0.4rem 0.9rem; font-size: 0.82rem; cursor: pointer; }

</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1>Socratic Mastery Audio</h1>
    <div class="stats" id="stats"></div>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div class="content">
  <div class="search-bar">
    <input type="text" id="search" placeholder="Search concepts...">
  </div>
  <div id="module-view" class="module-list-view"></div>
  <div id="reader-view" class="reader"></div>
</div>

<!-- Global audio player -->
<div class="player" id="player">
  <div class="player-inner">
    <div class="now-playing">
      <div class="title" id="player-title"></div>
      <div class="module" id="player-module"></div>
    </div>
    <div class="controls">
      <button onclick="skipTime(-15)" title="Back 15s">
        <svg viewBox="0 0 24 24"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="15" text-anchor="middle" font-size="7" fill="currentColor" font-weight="bold">15</text></svg>
      </button>
      <button class="play-pause" onclick="togglePlayback()" id="play-pause-btn">
        <svg viewBox="0 0 24 24" id="play-icon"><polygon points="5,3 19,12 5,21"/></svg>
        <svg viewBox="0 0 24 24" id="pause-icon" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button onclick="skipTime(30)" title="Forward 30s">
        <svg viewBox="0 0 24 24"><path d="M12.01 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="12" y="15" text-anchor="middle" font-size="7" fill="currentColor" font-weight="bold">30</text></svg>
      </button>
    </div>
    <div class="progress-area">
      <span class="time" id="time-current">0:00</span>
      <div class="progress-bar" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="time" id="time-total">0:00</span>
    </div>
    <button class="speed-btn" onclick="cycleSpeed()" id="speed-btn">1x</button>
  </div>
</div>

<audio id="audio"></audio>

<script>
// --- Data ---
let manifest = null;
let activeModule = null;
let currentConcept = null;
const audio = document.getElementById('audio');
let playbackSpeed = 1;
const speeds = [0.75, 1, 1.25, 1.5, 1.75, 2];

// --- Init ---
async function init() {
  try {
    const resp = await fetch('site-manifest.json');
    manifest = await resp.json();
  } catch {
    // Fallback: try loading from content directories
    manifest = { modules: [], totalConcepts: 0, totalWords: 0, estHours: 0 };
  }
  renderStats();
  renderTabs();
  if (manifest.modules.length > 0) {
    setActiveModule(manifest.modules[0].id);
  }
  document.getElementById('search').addEventListener('input', onSearch);
}

function renderStats() {
  const el = document.getElementById('stats');
  if (!el || typeof manifest === 'undefined' || !manifest.modules) return;
  // init() calls this before setActiveModule(), so activeModule may still be
  // undefined; fall back to the first module rather than reporting zero due.
  const mid = (typeof activeModule !== 'undefined' && activeModule) ? activeModule : manifest.modules[0].id;
  const due = maDueCount(mid);
  el.innerHTML = `${manifest.totalConcepts} concepts` +
    (due ? ` &middot; <span class="ma-due-pill">${due} due</span>` : ' &middot; all reviewed');
}

function renderTabs() {
  const container = document.getElementById('tabs');
  container.innerHTML = manifest.modules.map(m =>
    `<div class="tab" data-module="${m.id}" onclick="setActiveModule('${m.id}')">
      ${m.icon} ${m.label} <span class="count">${m.conceptCount}</span>
    </div>`
  ).join('');
}

function setActiveModule(moduleId) {
  activeModule = moduleId;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.module === moduleId);
  });
  document.getElementById('search').value = '';
  showReader(false);
  renderModuleView();
}

function renderModuleView(filter = '') {
  const container = document.getElementById('module-view');
  const mod = manifest.modules.find(m => m.id === activeModule);
  if (!mod) { container.innerHTML = ''; return; }
  const dueOnly = !!window.__maDueOnly;

  let html = `<div class="ma-filter">` +
    `<button class="ma-chip${dueOnly ? '' : ' on'}" onclick="maSetDueOnly(false)">All</button>` +
    `<button class="ma-chip${dueOnly ? ' on' : ''}" onclick="maSetDueOnly(true)">Due only (${maDueCount(activeModule)})</button>` +
    `</div>`;

  for (const cat of mod.categories) {
    let concepts = filter
      ? cat.concepts.filter(c => c.title.toLowerCase().includes(filter) || c.subcategory.toLowerCase().includes(filter))
      : cat.concepts;
    if (dueOnly) concepts = concepts.filter(c => maIsDue(maRec(c.slug)));
    if (concepts.length === 0) continue;

    html += `<div class="category">
      <div class="category-header">${cat.name} (${concepts.length})</div>
      <div class="concept-list">`;

    for (const c of concepts) {
      const diffDots = Array.from({length: 5}, (_, i) =>
        `<div class="dot${i < c.difficulty ? ' filled' : ''}"></div>`
      ).join('');
      const rec = maRec(c.slug);
      const due = maIsDue(rec);

      html += `<div class="concept-card" data-slug="${c.slug}" onclick="openConcept('${activeModule}', '${c.slug}')">
        <div class="ma-pip ma-${rec.state}" title="${rec.state}"></div>
        <div class="info">
          <div class="title">${c.title}</div>
          <div class="meta"><span class="difficulty">${diffDots}</span> ${c.subcategory}${due ? ' &middot; <span class="ma-duetag">due</span>' : ''}</div>
        </div>
        <div class="duration">~${c.estMinutes} min</div>
      </div>`;
    }
    html += '</div></div>';
  }

  if (html.indexOf('concept-card') === -1) {
    html += `<p style="color:var(--text-dim);text-align:center;padding:2rem">` +
            (dueOnly ? 'Nothing due. Switch to All.' : 'No matching concepts.') + `</p>`;
  }
  container.innerHTML = html;
  container.style.display = '';
  // keep the header pill in step when the module tab changes
  renderStats();
}

function onSearch(e) {
  const q = e.target.value.toLowerCase().trim();
  showReader(false);
  renderModuleView(q);
}

// --- Reader View ---
function parseFrontmatter(text) {
  // Declared inside the function on purpose: the patcher that splices this into
  // index.html extracts whole functions only, so anything at module scope would
  // silently fail to be injected and throw at runtime.
  const LIST_KEYS = ['figures', 'questions', 'cases'];
  const empty = { meta: {}, figures: [], questions: [], cases: [], body: text };
  if (!text.startsWith('---')) return empty;
  const end = text.indexOf('\n---', 3);
  if (end === -1) return empty;

  const raw  = text.substring(3, end);
  const body = text.substring(end + 4).replace(/^\s*\n/, '');

  const meta = {};
  const lists = {};
  for (const k of LIST_KEYS) lists[k] = [];

  let listKey = null;
  let current = null;
  const flush = () => { if (listKey && current) lists[listKey].push(current); current = null; };

  for (const line of raw.split('\n')) {
    if (!line.trim()) continue;

    const opener = line.match(/^(\w+):\s*$/);
    if (opener && LIST_KEYS.indexOf(opener[1]) !== -1) { flush(); listKey = opener[1]; continue; }

    // any non-indented key closes the current list
    if (listKey && !/^\s/.test(line)) { flush(); listKey = null; }

    if (listKey) {
      const item = line.match(/^\s*-\s*(\w+):\s*([\s\S]*)$/);
      if (item) { flush(); current = {}; current[item[1]] = stripQuotes(item[2]); continue; }
      const kv = line.match(/^\s+(\w+):\s*([\s\S]*)$/);
      if (kv && current) current[kv[1]] = stripQuotes(kv[2]);
      continue;
    }

    const kv = line.match(/^(\w+):\s*(.*)$/);
    if (kv) meta[kv[1]] = stripQuotes(kv[2]);
  }
  flush();

  return { meta, figures: lists.figures, questions: lists.questions, cases: lists.cases, body };
}

function stripQuotes(s) {
  s = (s || '').trim();
  if (s.length > 1 && ((s[0] === '"' && s.endsWith('"')) || (s[0] === "'" && s.endsWith("'")))) {
    return s.slice(1, -1);
  }
  return s;
}

function figureHtml(fig, moduleId, index) {
  if (!fig || !fig.file) return '';
  const src = `figures/${moduleId}/${fig.file}`;
  const alt = escapeHtml(fig.alt || fig.caption || `Figure ${index}`);

  let credit = '';
  if (fig.credit) {
    const text = escapeHtml(fig.credit) + (fig.license ? ' &mdash; ' + escapeHtml(fig.license) : '');
    credit = fig.url
      ? `<a class="fig-credit" href="${escapeHtml(fig.url)}" target="_blank" rel="noopener noreferrer">${text}</a>`
      : `<span class="fig-credit">${text}</span>`;
  }

  // Emitted on a single line with no stray indentation: .reader-body sets
  // `white-space: pre-wrap`, so any newline or leading space inside this
  // markup would render as visible blank space in the reader.
  return `<figure class="concept-figure">` +
           `<img src="${escapeHtml(src)}" alt="${alt}" loading="lazy">` +
           `<figcaption>` +
             `<span class="fig-label">Figure ${index}.</span> ` +
             (fig.caption ? escapeHtml(fig.caption) + ' ' : '') +
             credit +
           `</figcaption>` +
         `</figure>`;
}

function renderBody(body, figures, moduleId) {
  const used = new Set();
  let html = escapeHtml(body).replace(/\[\[fig:(\d+)\]\]/g, (match, n) => {
    const i = parseInt(n, 10);
    const fig = figures[i - 1];
    if (!fig) return '';
    used.add(i);
    return figureHtml(fig, moduleId, i);
  });

  const leftover = figures
    .map((fig, idx) => ({ fig, n: idx + 1 }))
    .filter(x => !used.has(x.n));

  if (leftover.length) {
    html += `<div class="figure-gallery"><h3>Figures</h3>` +
            leftover.map(x => figureHtml(x.fig, moduleId, x.n)).join('') +
            `</div>`;
  }
  return html;
}

function questionsHtml(questions) {
  if (!questions || !questions.length) return '';
  const cards = questions.map((q, i) => {
    if (!q || !q.q) return '';
    const probe = q.probe
      ? `<div class="q-probe"><span>Then they push:</span> ${escapeHtml(q.probe)}</div>` : '';
    return `<div class="q-card">` +
             `<div class="q-num">${i + 1}</div>` +
             `<div class="q-body">` +
               `<div class="q-text">${escapeHtml(q.q)}</div>` +
               `<button class="q-btn" onclick="toggleAnswer(this)">Show answer</button>` +
               `<div class="q-ans" hidden>${escapeHtml(q.a || '')}${probe}</div>` +
             `</div>` +
           `</div>`;
  }).join('');
  return `<div class="selftest">` +
           `<div class="selftest-head">` +
             `<h3>Self-test <span class="q-count">${questions.length}</span></h3>` +
             `<button class="q-all" onclick="toggleAllAnswers(this)">Reveal all</button>` +
           `</div>` +
           `<p class="selftest-hint">Answer out loud before revealing. These are the questions an examiner would actually ask.</p>` +
           cards +
         `</div>`;
}

function toggleAnswer(btn) {
  const ans = btn.parentNode.querySelector('.q-ans');
  const open = !ans.hidden;
  ans.hidden = open;
  btn.textContent = open ? 'Show answer' : 'Hide answer';
}

function toggleAllAnswers(btn) {
  const reveal = btn.textContent === 'Reveal all';
  const root = btn.closest('.selftest');
  root.querySelectorAll('.q-ans').forEach(a => { a.hidden = !reveal; });
  root.querySelectorAll('.q-btn').forEach(b => { b.textContent = reveal ? 'Hide answer' : 'Show answer'; });
  btn.textContent = reveal ? 'Hide all' : 'Reveal all';
}

function casesHtml(cases) {
  if (!cases || !cases.length) return '';

  const blocks = cases.map((c, ci) => {
    if (!c || !c.stem) return '';
    const stages = [];
    for (let n = 1; n <= 12; n++) {
      const q = c['q' + n], a = c['a' + n];
      if (!q) break;
      stages.push({ q: q, a: a || '' });
    }
    const stageHtml = stages.map((s, si) =>
      `<div class="case-stage" data-stage="${si}"${si === 0 ? '' : ' hidden'}>` +
        `<div class="case-q"><span class="case-step">Step ${si + 1}</span> ${escapeHtml(s.q)}</div>` +
        `<button class="case-btn" onclick="revealStage(this)">Commit, then reveal</button>` +
        `<div class="case-a" hidden>${escapeHtml(s.a)}</div>` +
      `</div>`).join('');

    return `<div class="case-card" data-case="${ci}">` +
             `<div class="case-head">Case ${ci + 1}${c.label ? ' &middot; ' + escapeHtml(c.label) : ''}</div>` +
             `<div class="case-stem">${escapeHtml(c.stem)}</div>` +
             `<div class="case-stages">${stageHtml}</div>` +
           `</div>`;
  }).join('');

  return `<div class="cases">` +
           `<div class="cases-head"><h3>Cases <span class="q-count">${cases.length}</span></h3></div>` +
           `<p class="selftest-hint">Say your answer out loud and commit before revealing. The case escalates as it would in the room.</p>` +
           blocks +
         `</div>`;
}

function revealStage(btn) {
  const stage = btn.parentNode;
  const ans = stage.querySelector('.case-a');
  ans.hidden = false;
  btn.hidden = true;
  const next = stage.nextElementSibling;
  if (next && next.classList.contains('case-stage')) {
    next.hidden = false;
  } else {
    const done = document.createElement('div');
    done.className = 'case-done';
    done.textContent = 'End of case.';
    stage.parentNode.appendChild(done);
  }
}

function maLoad() {
  try { return JSON.parse(localStorage.getItem(maCfg().progressKey) || '{}'); }
  catch { return {}; }

function maWrite(p) {
  try { localStorage.setItem(maCfg().progressKey, JSON.stringify(p)); } catch {}

function maSyncKey() {
  const c = maCfg();
  let k = null;
  try { k = localStorage.getItem(c.syncKey); } catch {}

    try { localStorage.setItem(c.syncKey, k); } catch {}

function maRec(slug) {
  const p = maLoad();
  return p[slug] || {
    ease_factor: 2.5, interval_days: 0, times_correct: 0, times_incorrect: 0,
    state: 'new', last_reviewed: null, next_review: null,
  };
}

function maSm2(rec, rating) {
  const p = Object.assign({}, rec);
  const now = new Date();
  p.last_reviewed = now.toISOString();

  if (rating === 'got') {
    p.times_correct++;
    p.ease_factor = Math.min(3.0, p.ease_factor + 0.1);
    p.interval_days = Math.max(1, p.interval_days === 0 ? 1 : p.interval_days * 2);
  } else if (rating === 'shaky') {
    p.times_correct++;
    p.interval_days = Math.max(1, p.interval_days === 0 ? 1 : p.interval_days * 1.5);
  } else {
    p.times_incorrect++;
    p.ease_factor = Math.max(1.3, p.ease_factor - 0.2);
    p.interval_days = 1;
  }

  if (p.interval_days > 21) p.state = 'mastered';
  else if (p.interval_days > 3) p.state = 'review';
  else if (p.times_correct + p.times_incorrect > 0) p.state = 'learning';
  else p.state = 'new';

  p.next_review = new Date(now.getTime() + p.interval_days * 86400000).toISOString();
  return p;
}

function maIsDue(rec) {
  if (!rec || rec.state === 'new' || !rec.next_review) return true;
  return new Date(rec.next_review).getTime() <= Date.now();
}

function maDueCount(moduleId) {
  const mod = manifest.modules.find(m => m.id === moduleId);
  if (!mod) return 0;
  let n = 0;
  for (const cat of mod.categories) for (const c of cat.concepts) if (maIsDue(maRec(c.slug))) n++;
  return n;
}

function maRate(slug, rating) {
  const p = maLoad();
  p[slug] = maSm2(maRec(slug), rating);
  maWrite(p);
  maCloudSave();
  const bar = document.getElementById('ma-review-bar');
  if (bar) bar.outerHTML = maReviewBarHtml(slug);
  renderStats();
}

function maFmtDue(rec) {
  if (!rec.next_review) return 'not started';
  const days = Math.round((new Date(rec.next_review).getTime() - Date.now()) / 86400000);
  if (days <= 0) return 'due now';
  if (days === 1) return 'due tomorrow';
  return 'due in ' + days + ' days';
}

function maReviewBarHtml(slug) {
  const rec = maRec(slug);
  const reps = rec.times_correct + rec.times_incorrect;
  return `<div class="ma-review" id="ma-review-bar">` +
           `<div class="ma-review-head">` +
             `<span class="ma-state ma-${rec.state}">${rec.state}</span>` +
             `<span class="ma-due">${maFmtDue(rec)}${reps ? ' &middot; ' + reps + ' review' + (reps === 1 ? '' : 's') : ''}</span>` +
           `</div>` +
           `<p class="ma-review-hint">Rate yourself after working the cases. This schedules when the concept comes back.</p>` +
           `<div class="ma-btns">` +
             `<button class="ma-btn ma-missed" onclick="maRate('${slug}','missed')">Missed it</button>` +
             `<button class="ma-btn ma-shaky"  onclick="maRate('${slug}','shaky')">Shaky</button>` +
             `<button class="ma-btn ma-got"    onclick="maRate('${slug}','got')">Got it</button>` +
           `</div>` +
         `</div>`;
}

function maCloudSave() {
  const c = maCfg();
  if (c.anon.indexOf('PLACEHOLDER') !== -1) return;
  clearTimeout(window.__maSaveTimer);
  window.__maSaveTimer = setTimeout(() => {
    fetch(c.url + '/rest/v1/sm_cloud_sync?on_conflict=sync_key', {
      method: 'POST',
      headers: {
        apikey: c.anon, Authorization: 'Bearer ' + c.anon,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates,return=minimal',
      },
      body: JSON.stringify({
        sync_key: maSyncKey(),
        progress: maLoad(),
        sessions: [],
        updated_at: new Date().toISOString(),
      }),
    }).catch(() => {});
  }, 1500);
}

async function maCloudLoad() {
  const c = maCfg();
  if (c.anon.indexOf('PLACEHOLDER') !== -1) return false;
  try {
    const r = await fetch(
      c.url + '/rest/v1/sm_cloud_sync?sync_key=eq.' + encodeURIComponent(maSyncKey()) + '&select=progress',
      { headers: { apikey: c.anon, Authorization: 'Bearer ' + c.anon } });
    if (!r.ok) return false;
    const rows = await r.json();
    if (!rows.length || !rows[0].progress) return false;
    const cloud = rows[0].progress, local = maLoad(), merged = Object.assign({}, local);
    for (const slug of Object.keys(cloud)) {
      const lt = local[slug]  && local[slug].last_reviewed  ? Date.parse(local[slug].last_reviewed)  : 0;
      const ct = cloud[slug]  && cloud[slug].last_reviewed  ? Date.parse(cloud[slug].last_reviewed)  : 0;
      if (ct > lt) merged[slug] = cloud[slug];
    }
    maWrite(merged);
    return true;
  } catch { return false; }
}

async function maDrill(moduleId, slug, title) {
  const panel = document.getElementById('ma-drill');
  if (!panel) return;
  panel.hidden = false;
  panel.innerHTML = `<div class="ma-drill-head"><strong>Socratic drill</strong>` +
    `<button class="q-all" onclick="document.getElementById('ma-drill').hidden=true">Close</button></div>` +
    `<div class="ma-drill-body" id="ma-drill-body">Starting…</div>`;

  let source = '';
  try {
    const r = await fetch(`content/${moduleId}/${slug}.md`);
    if (r.ok) {
      let t = await r.text();
      const end = t.indexOf('\n---', 3);
      if (end !== -1) t = t.substring(end + 4);
      // Send the whole chapter. The longest is ~22k characters (~5.5k tokens),
      // which the tutor handles; truncating to a few thousand left it guessing
      // about the back half of the material.
      source = t.slice(0, 30000);
    }
  } catch {}

  const mod = manifest.modules.find(m => m.id === moduleId);
  let concept = null;
  if (mod) for (const cat of mod.categories) { concept = cat.concepts.find(c => c.slug === slug); if (concept) break; }

  try {
    const res = await fetch(maCfg().url + '/functions/v1/socratic-tutor', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'start_session',
        module: 'neuro_boards',
        messages: [{ role: 'system', content: 'Source material for this concept:\n\n' + source }],
        concepts: [{
          name: title,
          category: concept ? concept.category : '',
          subcategory: concept ? concept.subcategory : '',
          difficulty: concept ? concept.difficulty : 3,
        }],
        weakZones: [],
        currentConcept: title,
      }),
    });
    const data = await res.json();
    const body = document.getElementById('ma-drill-body');
    if (body) body.textContent = data.content || data.error || 'No response from tutor.';
  } catch (e) {
    const body = document.getElementById('ma-drill-body');
    if (body) body.textContent = 'Tutor unavailable: ' + e.message;
  }
}

function maSetDueOnly(v) {
  window.__maDueOnly = v;
  renderModuleView((document.getElementById('search') || {}).value ? document.getElementById('search').value.toLowerCase() : '');
}

async function openConcept(moduleId, slug) {
  const mdPath = `content/${moduleId}/${slug}.md`;
  try {
    const resp = await fetch(mdPath);
    if (!resp.ok) throw new Error('not found');
    const text = await resp.text();

    const { figures, questions, cases, body } = parseFrontmatter(text);

    const mod = manifest.modules.find(m => m.id === moduleId);
    let concept = null;
    if (mod) {
      for (const cat of mod.categories) {
        concept = cat.concepts.find(c => c.slug === slug);
        if (concept) break;
      }
    }

    const title = concept ? concept.title : slug.replace(/-/g, ' ');
    showReader(true, title, body, moduleId, slug, figures, questions, cases);
  } catch {
    showReader(true, slug.replace(/-/g, ' '), 'Content file not found.', moduleId, slug, [], [], []);
  }
}

function showReader(show, title, text, moduleId, slug, figures, questions, cases) {
  const reader = document.getElementById('reader-view');
  const moduleView = document.getElementById('module-view');

  if (!show) {
    reader.classList.remove('visible');
    moduleView.style.display = '';
    return;
  }

  moduleView.style.display = 'none';

  reader.innerHTML = `
    <div class="reader-header">
      <span class="back" onclick="showReader(false)">&larr; Back</span>
      <h2>${escapeHtml(title)}</h2>
    </div>
    <div class="reader-body">${renderBody(text, figures || [], moduleId)}${questionsHtml(questions || [])}${casesHtml(cases || [])}` +
      `<button class="ma-drill-btn" onclick="maDrill('${moduleId}','${slug}','${String(title).replace(/'/g, "\\'")}')">Drill this with the tutor</button>` +
      `<div class="ma-drill" id="ma-drill" hidden></div>` +
      maReviewBarHtml(slug) + `</div>
  `;
  reader.classList.add('visible');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- Audio Player ---
function playConcept(moduleId, slug, title) {
  const audioPath = `audio/${moduleId}/${slug}.mp3`;
  const mod = manifest.modules.find(m => m.id === moduleId);
  const modLabel = mod ? `${mod.icon} ${mod.label}` : moduleId;

  currentConcept = { moduleId, slug, title };

  audio.src = audioPath;
  audio.playbackRate = playbackSpeed;
  audio.play().catch(() => {
    // Audio file may not exist yet
    document.getElementById('player-title').textContent = title + ' (audio not found)';
  });

  document.getElementById('player-title').textContent = title;
  document.getElementById('player-module').textContent = modLabel;
  document.getElementById('player').classList.add('visible');
  updatePlayPauseIcon(true);

  // Highlight active card
  document.querySelectorAll('.concept-card').forEach(c => {
    c.classList.toggle('active', c.dataset.slug === slug);
  });
}

function togglePlayback() {
  if (audio.paused) {
    audio.play();
    updatePlayPauseIcon(true);
  } else {
    audio.pause();
    updatePlayPauseIcon(false);
  }
}

function updatePlayPauseIcon(playing) {
  document.getElementById('play-icon').style.display = playing ? 'none' : '';
  document.getElementById('pause-icon').style.display = playing ? '' : 'none';
}

function skipTime(seconds) {
  audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + seconds));
}

function cycleSpeed() {
  const idx = speeds.indexOf(playbackSpeed);
  playbackSpeed = speeds[(idx + 1) % speeds.length];
  audio.playbackRate = playbackSpeed;
  document.getElementById('speed-btn').textContent = playbackSpeed + 'x';
}

function formatTime(s) {
  if (isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

// Audio events
audio.addEventListener('timeupdate', () => {
  const pct = (audio.currentTime / (audio.duration || 1)) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('time-current').textContent = formatTime(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  document.getElementById('time-total').textContent = formatTime(audio.duration);
});

audio.addEventListener('ended', () => {
  updatePlayPauseIcon(false);
  // Auto-play next concept
  playNext();
});

audio.addEventListener('pause', () => updatePlayPauseIcon(false));
audio.addEventListener('play', () => updatePlayPauseIcon(true));

// Progress bar click to seek
document.getElementById('progress-bar').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * (audio.duration || 0);
});

// Auto-play next
function playNext() {
  if (!currentConcept) return;
  const mod = manifest.modules.find(m => m.id === currentConcept.moduleId);
  if (!mod) return;

  const allConcepts = [];
  for (const cat of mod.categories) {
    for (const c of cat.concepts) allConcepts.push(c);
  }

  const idx = allConcepts.findIndex(c => c.slug === currentConcept.slug);
  if (idx >= 0 && idx < allConcepts.length - 1) {
    const next = allConcepts[idx + 1];
    playConcept(currentConcept.moduleId, next.slug, next.title);
  }
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlayback(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); skipTime(-15); }
  if (e.code === 'ArrowRight') { e.preventDefault(); skipTime(30); }
});

// Init
init();
